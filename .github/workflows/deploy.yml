name: Build and validate release candidate
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8086
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: tabeeb_test_ci
      DB_USER: root
      DB_PASS: disposable-ci-password
      HMAC_SECRET: disposable-ci-hmac-material-minimum-32-characters
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom, gd
      - name: Syntax validation
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          node --check app.js
      - name: Application contracts
        run: php tests/contracts.php
      - name: Real MariaDB driver migrations
        run: |
          php tests/mysql_prepare.php
          php scripts/migrate.php --seed
          php scripts/migrate.php
      - name: Build immutable release bundle
        run: python3 ops/package.py --output Tabeeb_Production_Package.zip
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate
          path: Tabeeb_Production_Package.zip
# Publishing is a separate CLI release using ops/release.sh and a protected environment.
# This workflow has no hosting credentials and cannot overwrite production or runtime data.
