name: Test and deploy Tabeeb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabeeb-main-deployment
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.event_name == 'pull_request' && 'validation' || 'production' }}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8086
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: tabeeb_test_ci
      DB_USER: root
      DB_PASS: disposable-ci-password
      HMAC_SECRET: disposable-ci-hmac-material-minimum-32-characters
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom, gd, curl, fileinfo
          coverage: none
      - name: Local application and HTTP checks
        run: python3 tests/run_local.py
      - name: Real MariaDB fresh and repeat migrations
        run: |
          php tests/mysql_prepare.php
          php scripts/migrate.php --seed
          php scripts/migrate.php
          php tests/user_access.php unit
          php tests/analytics_measurement.php
          php tests/google_reporting.php
          SQL_MODE_TEST_DISPOSABLE=1 php tests/mysql_sql_mode.php
          APP_ENV=production APP_URL=https://tabeebgroup.com SMTP_PASS=disposable-smtp-fixture SMTP_VERIFICATION_TEST_DISPOSABLE=1 php tests/mysql_smtp_verification.php --to=smtp_fixture@example.invalid
          APP_ENV=production APP_URL=https://tabeebgroup.com SMTP_PASS=disposable-smtp-fixture-updated SMTP_VERIFICATION_TEST_DISPOSABLE=1 php tests/mysql_smtp_verification.php --to=smtp_fixture@example.invalid
      - name: Build and verify the deployment bundle
        run: |
          python3 ops/package.py --output Tabeeb_release.zip
          mkdir verified-release
          unzip -q Tabeeb_release.zip -d verified-release
          php verified-release/ops/verify_package.php
      - name: Deploy staging, verify it, then deploy production
        if: github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_ENABLED == 'true'
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
          CPANEL_USER: ${{ vars.CPANEL_USER }}
          CPANEL_ACCOUNT_ROOT: ${{ vars.CPANEL_ACCOUNT_ROOT }}
          CPANEL_PHP_BIN: ${{ vars.CPANEL_PHP_BIN }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
          STAGING_SMOKE_USER: ${{ secrets.STAGING_SMOKE_USER }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: python3 ops/github_deploy.py --bundle Tabeeb_release.zip
      - name: Setup status
        if: vars.AUTO_DEPLOY_ENABLED != 'true'
        run: echo 'Checks completed; deployment is disabled until initial hosting setup is verified.'
