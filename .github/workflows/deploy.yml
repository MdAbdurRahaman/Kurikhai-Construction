name: 🚀 Deploy Website to cPanel

on:
  push:
    branches:
      - main
      - rebrand-tabeeb-contractor

jobs:
  web-deploy:
    name: 🌐 Direct Deploy to cPanel (HTTPS)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4

      - name: 📦 Package Website Files
        run: |
          zip -r website-deploy.zip . -x ".git*" ".github*" "*.md" ".cpanel.yml" "*.zip"

      - name: 🚀 Upload and Extract to cPanel public_html
        run: |
          CPANEL_USER="${{ secrets.CPANEL_USERNAME || 'tabeebgroup' }}"
          CPANEL_HOST="${{ secrets.CPANEL_HOST || '151.158.158.31' }}"
          API_TOKEN="${{ secrets.CPANEL_API_TOKEN }}"
          
          if [ -z "$API_TOKEN" ]; then
            echo "::error::CPANEL_API_TOKEN secret is missing! Please add it in GitHub Settings -> Secrets -> Actions."
            exit 1
          fi

          echo "1️⃣ Uploading zip and extractor to cPanel public_html..."
          UPLOAD_RES=$(curl -k -s -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${API_TOKEN}" \
            -F "dir=public_html" \
            -F "file-1=@website-deploy.zip" \
            -F "file-2=@unzip.php" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files")
          echo "Upload Response: $UPLOAD_RES"

          echo "2️⃣ Triggering file extraction..."
          EXTRACT_RES=$(curl -k -s -L "https://tabeebgroup.com/unzip.php" || true)
          echo "Extractor Response: $EXTRACT_RES"

          echo "🎉 Website deployed successfully to live server!"
