name: 🚀 Deploy Website to cPanel

on:
  push:
    branches:
      - main
      - rebrand-tabeeb-contractor

jobs:
  web-deploy:
    name: 🌐 Secure Deploy to cPanel (HTTPS UAPI)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4

      - name: 📦 Package Website Files
        run: |
          zip -r website-deploy.zip . -x ".git*" ".github*" "*.md" ".cpanel.yml" "*.zip" ".env*" "data/backup_*"

      - name: 🚀 Upload and Securely Extract via cPanel UAPI
        run: |
          CPANEL_USER="${{ secrets.CPANEL_USERNAME || 'tabeebgroup' }}"
          CPANEL_HOST="${{ secrets.CPANEL_HOST || '151.158.158.31' }}"
          API_TOKEN="${{ secrets.CPANEL_API_TOKEN }}"
          
          if [ -z "$API_TOKEN" ]; then
            echo "::error::CPANEL_API_TOKEN secret is missing! Please add it in GitHub Settings -> Secrets -> Actions."
            exit 1
          fi

          echo "1️⃣ Uploading package archive to cPanel public_html..."
          UPLOAD_RES=$(curl -k -s -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${API_TOKEN}" \
            -F "dir=public_html" \
            -F "file-1=@website-deploy.zip" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files")
          echo "Upload Response: $UPLOAD_RES"

          echo "2️⃣ Triggering native authenticated cPanel extraction..."
          EXTRACT_RES=$(curl -k -s -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${API_TOKEN}" \
            -d "dir=public_html" \
            -d "file=website-deploy.zip" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/extract_files")
          echo "Extraction Response: $EXTRACT_RES"

          echo "3️⃣ Cleaning up temporary deployment archive..."
          curl -k -s -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${API_TOKEN}" \
            -d "dir=public_html" \
            -d "files=website-deploy.zip" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/delete_files" > /dev/null || true

          echo "🎉 Website securely deployed to production server!"
